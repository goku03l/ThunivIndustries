  <style>
/* ── Tokens ──────────────────────────────────────────── */
:root {
  --brg:         #1B4332;
  --brg-mid:     #2D6A4F;
  --brg-pale:    #E4EDE6;
  --warm-white:  #F7F7F2;
  --silver:      #8A9A8E;
  --silver-lt:   #C8D4CA;
  --silver-dark: #5A6B5E;
  --ink:         #1C2319;
  --mist:        #5A6B5E;
  --page-w:      900px;

  --ff-display: 'Playfair Display', Georgia, serif;
  --ff-body:    'DM Sans', system-ui, sans-serif;
}

/* ── Reset ───────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }

body {
  background: #e8e8e2;
  font-family: var(--ff-body);
  color: var(--ink);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 40px 20px 80px;
}

/* ── Page shell ──────────────────────────────────────── */
.page {
  background: var(--warm-white);
  width: 100%;
  max-width: var(--page-w);
  box-shadow: 0 8px 60px rgba(27,67,50,0.18), 0 2px 8px rgba(27,67,50,0.08);
  position: relative;
}

/* ── PDF button ──────────────────────────────────────── */
.pdf-btn {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background: var(--brg);
  color: var(--warm-white);
  font-family: var(--ff-body);
  font-size: 13px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  letter-spacing: 0.03em;
  transition: background 0.2s, transform 0.15s;
}
.pdf-btn:hover { background: var(--brg-mid); transform: translateY(-1px); }
.pdf-btn svg { flex-shrink: 0; }

/* ── HEADER GRID ─────────────────────────────────────── */
.header-grid {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0;
  background: var(--brg);
  padding: 48px 52px 44px;
  position: relative;
  overflow: hidden;
}

/* subtle grid lines on header */
.header-grid::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(200,212,202,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(200,212,202,0.07) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.header-left {
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  z-index: 1;
}

.header-eyebrow {
  font-family: var(--ff-body);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.22em;
  color: var(--silver);
  text-transform: uppercase;
}

.header-name {
  font-family: var(--ff-display);
  font-size: 58px;
  font-weight: 700;
  color: var(--warm-white);
  line-height: 1;
  letter-spacing: -0.01em;
}

.header-tagline {
  font-family: var(--ff-display);
  font-size: 14px;
  font-style: italic;
  color: var(--brg-pale);
  line-height: 1.6;
  max-width: 420px;
  padding-top: 4px;
  border-top: 1px solid rgba(200,212,202,0.3);
}

.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  position: relative;
  z-index: 1;
}

.contact-block {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.contact-item {
  font-size: 11.5px;
  color: var(--silver-lt);
  letter-spacing: 0.01em;
}

.contact-item span {
  color: var(--silver);
  margin-right: 6px;
}

.header-stamp {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  border-top: 1px solid rgba(200,212,202,0.25);
  padding-top: 12px;
}

.stamp-year {
  font-family: var(--ff-display);
  font-size: 32px;
  font-weight: 700;
  color: rgba(200,212,202,0.18);
  line-height: 1;
  letter-spacing: -0.02em;
}

.stamp-label {
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--silver);
  text-align: right;
  line-height: 1.5;
}

/* ── BODY GRID ───────────────────────────────────────── */
.body-grid {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 0;
}

/* ── SIDEBAR ─────────────────────────────────────────── */
.sidebar {
  background: var(--brg-pale);
  padding: 40px 28px;
  border-right: 1px solid var(--silver-lt);
  display: flex;
  flex-direction: column;
  gap: 40px;
}

/* ── MAIN COL ────────────────────────────────────────── */
.main-col {
  padding: 40px 44px;
  display: flex;
  flex-direction: column;
  gap: 44px;
}

/* ── Section label ───────────────────────────────────── */
.section-label {
  font-family: var(--ff-body);
  font-size: 9.5px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--silver-dark);
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--silver-lt);
}

/* ── About text ──────────────────────────────────────── */
.about-text p {
  font-size: 12.5px;
  line-height: 1.75;
  color: var(--ink);
  margin-bottom: 12px;
}

.about-text p:last-child {
  font-family: var(--ff-display);
  font-style: italic;
  font-size: 12px;
  color: var(--mist);
  margin-bottom: 0;
}

/* ── Timeline ────────────────────────────────────────── */
.timeline {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.timeline-item {
  display: grid;
  grid-template-columns: 2px 1fr;
  gap: 0 14px;
}

.timeline-bar {
  background: var(--silver-lt);
  border-radius: 2px;
  position: relative;
}

.timeline-bar::before {
  content: '';
  position: absolute;
  top: 4px;
  left: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--brg);
  border: 2px solid var(--brg-pale);
}

.timeline-content {}

.timeline-period {
  font-family: var(--ff-display);
  font-style: italic;
  font-size: 10px;
  color: var(--silver-dark);
  margin-bottom: 3px;
}

.timeline-role {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.35;
  margin-bottom: 2px;
}

.timeline-org {
  font-size: 10.5px;
  color: var(--mist);
  line-height: 1.4;
}

/* ── Builds grid ─────────────────────────────────────── */
.builds-grid {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.build-card {
  display: grid;
  grid-template-columns: 1fr 170px;
  border: 1px solid var(--silver-lt);
  background: var(--warm-white);
  transition: box-shadow 0.2s;
}

.build-card:hover {
  box-shadow: 0 4px 24px rgba(27,67,50,0.1);
}

.build-left {
  padding: 20px 22px;
  border-right: 1px solid var(--silver-lt);
}

.build-title {
  font-family: var(--ff-display);
  font-size: 20px;
  font-weight: 700;
  color: var(--brg);
  margin-bottom: 3px;
  line-height: 1;
}

.build-subtitle {
  font-size: 10.5px;
  color: var(--silver-dark);
  font-style: italic;
  margin-bottom: 12px;
  letter-spacing: 0.01em;
}

.build-story {
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--ink);
  margin-bottom: 10px;
}

.build-company {
  font-size: 10.5px;
  color: var(--mist);
  font-style: italic;
}

.build-right {
  background: var(--brg);
  padding: 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.build-stat-label {
  font-size: 8.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--silver-lt);
  margin-bottom: 4px;
  font-weight: 500;
}

.build-stat-value {
  font-family: var(--ff-display);
  font-size: 13px;
  font-weight: 600;
  color: var(--warm-white);
  line-height: 1.3;
}

.build-stack {
  font-size: 10.5px;
  color: var(--brg-pale);
  line-height: 1.5;
}

.build-role {
  font-size: 11px;
  font-weight: 500;
  color: var(--silver-lt);
  letter-spacing: 0.02em;
}

/* ── Principles grid ─────────────────────────────────── */
.principles-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.principle-card {
  background: var(--brg-pale);
  padding: 18px 20px;
  border-left: 3px solid var(--brg);
}

.principle-headline {
  font-family: var(--ff-display);
  font-style: italic;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--brg);
  margin-bottom: 8px;
}

.principle-body {
  font-size: 12px;
  line-height: 1.7;
  color: var(--ink);
}

/* ── Looking for ─────────────────────────────────────── */
.looking-card {
  border: 1px solid var(--silver-lt);
  border-left: 4px solid var(--brg);
  background: var(--warm-white);
  padding: 24px 28px;
}

.looking-headline {
  font-family: var(--ff-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--brg);
  line-height: 1.5;
  margin-bottom: 12px;
}

.looking-body {
  font-size: 13px;
  line-height: 1.75;
  color: var(--ink);
  margin-bottom: 16px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--silver-lt);
}

.looking-cta {
  font-family: var(--ff-display);
  font-style: italic;
  font-size: 13px;
  color: var(--brg-mid);
  line-height: 1.6;
}

/* ── Footer ──────────────────────────────────────────── */
.footer {
  background: var(--brg);
  padding: 14px 52px;
  text-align: center;
  font-size: 11px;
  color: var(--silver);
  letter-spacing: 0.06em;
}

/* ── Print / PDF styles ──────────────────────────────── */
@media print {
  body {
    background: none;
    padding: 0;
    display: block;
  }

  .pdf-btn { display: none !important; }

  .page {
    max-width: 100%;
    width: 100%;
    box-shadow: none;
  }

  .header-grid { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .build-right  { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sidebar      { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .footer       { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .principle-card { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .looking-card   { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  @page {
    size: A4;
    margin: 0;
  }
}

/* render.js — reads RESUME config and builds the DOM */

(function () {

  /* ── Header ───────────────────────────────────────── */

    { icon: '↗', value: R.contact.github },

    div.className = 'contact-item';
    div.innerHTML = `<span>${icon}</span>${value}`;

  });

  /* ── About ────────────────────────────────────────── */
  const aboutEl = document.getElementById('s-about');
  R.about.forEach(text => {
    const p = document.createElement('p');

    aboutEl.appendChild(p);

  /* ── Timeline ─────────────────────────────────────── */

  R.timeline.forEach(item => {
    timelineEl.innerHTML += `
      <div class="timeline-item">
        <div class="timeline-bar"></div>
        <div class="timeline-content">

  /* ── Builds ───────────────────────────────────────── */
  const buildsEl = document.getElementById('s-builds');

})();

  <script>
/* pdf.js — PDF download via html2pdf.js */

function downloadPDF() {
  const btn = document.querySelector('.pdf-btn');
  btn.textContent = 'Generating…';
  btn.disabled = true;

  /* Load html2pdf on demand */
  const script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
  script.onload = function () {
    const element = document.getElementById('resume');

    const opt = {
      margin:      0,
      filename:    'Gokul_Kumar_FounderOffice.pdf',
      image:       { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale:         2,
        useCORS:       true,
        logging:       false,
        letterRendering: true
      },
      jsPDF: {
        unit:        'mm',
        format:      'a4',
        orientation: 'portrait'
      },
      pagebreak: { mode: ['avoid-all'] }
    };

    html2pdf()
      .set(opt)
      .from(element)
      .save()
      .then(() => {
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Downloaded`;
        setTimeout(() => {
          btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download PDF`;
          btn.disabled = false;
        }, 2500);
      });
  };

  document.head.appendChild(script);
}

</script>

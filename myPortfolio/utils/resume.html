<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Resume</title>
<style>
  :root {
    --brg:       #1B4332;
    --brg-mid:   #2D6A4F;
    --surface:   #F7F7F2;
    --ink:       #1C2319;
    --mist:      #5E6E62;
    --silver:    #8A9A8E;
    --silver-lt: #C8D4CA;
    --silver-dk: #5A6B5E;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11pt;
    line-height: 1.5;
    color: var(--ink);
    background: var(--surface);
    max-width: 820px;
    margin: 0 auto;
    padding: 36px 40px 48px;
  }

  /* Header */
  #r-name    { font-size: 24pt; font-weight: 700; color: var(--brg); margin-bottom: 2px; }
  #r-tagline { font-size: 9.5pt; color: var(--silver-dk); margin-bottom: 8px; letter-spacing: .04em; }
  #r-contact { font-size: 9.5pt; color: var(--mist); }
  #r-contact a { color: var(--brg-mid); text-decoration: none; }
  #r-contact a:hover { text-decoration: underline; }
  .sep { margin: 0 6px; color: var(--silver); }

  hr { border: none; border-top: 1.5px solid var(--brg); margin: 14px 0 10px; }

  h2 {
    font-size: 10.5pt; font-weight: 700;
    text-transform: uppercase; letter-spacing: .12em;
    color: var(--brg);
    border-bottom: 1px solid var(--silver-lt);
    padding-bottom: 3px; margin: 20px 0 10px;
  }

  /* Summary */
  .summary p { font-size: 10.5pt; margin-bottom: 6px; }

  /* Experience & Projects */
  .block       { margin-bottom: 14px; }
  .block-hdr   { display: flex; justify-content: space-between; align-items: baseline; }
  .block-title { font-weight: 700; font-size: 11pt; color: var(--ink); }
  .block-title.proj { color: var(--brg); }
  .block-meta  { font-size: 9.5pt; color: var(--mist); white-space: nowrap; }
  .block-org   { font-size: 10pt; color: var(--silver-dk); margin-bottom: 4px; }
  .block-sub   { font-size: 10pt; font-style: italic; color: var(--silver-dk); margin-bottom: 4px; }
  .block ul    { padding-left: 18px; margin-top: 4px; }
  .block li    { font-size: 10.5pt; margin-bottom: 3px; }
  .block li strong { color: var(--brg); }
  .block p     { font-size: 10.5pt; margin-bottom: 3px; }
  .stack       { font-size: 9.5pt; color: var(--mist); margin-top: 3px; }
  .stack strong{ color: var(--silver-dk); }
  .proj-links  { font-size: 9.5pt; margin-top: 3px; }
  .proj-links a{ color: var(--brg-mid); margin-right: 10px; text-decoration: none; }
  .proj-links a:hover { text-decoration: underline; }

  /* Skills */
  .skill-row        { font-size: 10.5pt; margin-bottom: 5px; }
  .skill-row strong { display: inline-block; min-width: 160px; color: var(--brg); }

  /* Education */
  .edu-hdr   { display: flex; justify-content: space-between; align-items: baseline; }
  .edu-deg   { font-weight: 700; font-size: 11pt; }
  .edu-period{ font-size: 9.5pt; color: var(--mist); }
  .edu-org   { font-size: 10pt; color: var(--silver-dk); }

  /* Toolbar */
  .toolbar { display: flex; justify-content: flex-end; margin: 10px 0 4px; }
  .btn-pdf {
    background: var(--brg); color: var(--surface);
    border: none; padding: 9px 20px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 10pt; font-weight: 600;
    letter-spacing: .04em; cursor: pointer;
    transition: background .18s;
  }
  .btn-pdf:hover { background: var(--brg-mid); }

  @media print {
    @page { size: Letter; margin: 14mm 16mm; }
    body { padding: 0; max-width: 100%; background: #fff; }
    .toolbar { display: none !important; }
  }
</style>
</head>
<body>

<div id="resume-root"></div>

<!-- Load your content first, then the renderer -->
<script src="config.js"></script>
<script>
(function () {

  /* ── tiny helpers ── */
  function el(tag, cls, html) {
    var d = document.createElement(tag);
    if (cls)  d.className   = cls;
    if (html !== undefined) d.innerHTML = html;
    return d;
  }
  function append(parent) {
    var children = Array.prototype.slice.call(arguments, 1);
    children.forEach(function(c){ if (c) parent.appendChild(c); });
    return parent;
  }

  /* ── HEADER ── */
  function buildHeader() {
    var wrap = el('div', 'header');
    append(wrap,
      el('div', null, null),   // spacer — name set below via id
      el('div', 'eyebrow', null)
    );

    var name = el('div');
    name.id = 'r-name';
    name.textContent = RESUME.name;

    var tag = el('div');
    tag.id = 'r-tagline';
    tag.textContent = RESUME.tagline;

    var contact = el('div');
    contact.id = 'r-contact';
    RESUME.contact.forEach(function(c, i) {
      if (i > 0) contact.appendChild(el('span', 'sep', '|'));
      if (c.href) {
        var a = el('a');
        a.href = c.href;
        if (!c.href.startsWith('mailto') && !c.href.startsWith('tel')) a.target = '_blank';
        a.textContent = c.value;
        contact.appendChild(a);
      } else {
        contact.appendChild(document.createTextNode(c.value));
      }
    });

    append(wrap, name, tag, contact);
    return wrap;
  }

  /* ── SECTION HEADING ── */
  function heading(text) { return el('h2', null, text); }

  /* ── SUMMARY ── */
  function buildSummary() {
    var wrap = el('div', 'summary');
    RESUME.summary.forEach(function(para) {
      wrap.appendChild(el('p', null, para));
    });
    return wrap;
  }

  /* ── EXPERIENCE ── */
  function buildExperience() {
    var frag = document.createDocumentFragment();
    RESUME.experience.forEach(function(job) {
      var block = el('div', 'block');

      var hdr = el('div', 'block-hdr');
      append(hdr, el('div', 'block-title', job.title), el('div', 'block-meta', job.period));

      var ul = el('ul');
      job.bullets.forEach(function(b) { ul.appendChild(el('li', null, b)); });

      append(block, hdr, el('div', 'block-org', job.org), ul);
      frag.appendChild(block);
    });
    return frag;
  }

  /* ── SKILLS ── */
  function buildSkills() {
    var wrap = el('div');
    RESUME.skills.forEach(function(row) {
      var r = el('div', 'skill-row');
      r.innerHTML = '<strong>' + row.category + ':</strong> ' + row.items;
      wrap.appendChild(r);
    });
    return wrap;
  }

  /* ── EDUCATION ── */
  function buildEducation() {
    var frag = document.createDocumentFragment();
    RESUME.education.forEach(function(edu) {
      var wrap = el('div', 'block');
      var hdr  = el('div', 'edu-hdr');
      append(hdr, el('div', 'edu-deg', edu.degree), el('div', 'edu-period', edu.period));
      append(wrap, hdr, el('div', 'edu-org', edu.org));
      frag.appendChild(wrap);
    });
    return frag;
  }

  /* ── PROJECTS ── */
  function buildProjects() {
    var frag = document.createDocumentFragment();
    RESUME.projects.forEach(function(proj) {
      var block = el('div', 'block');

      var hdr = el('div', 'block-hdr');
      append(hdr, el('div', 'block-title proj', proj.title), el('div', 'block-meta', proj.type));

      var stack = el('div', 'stack');
      stack.innerHTML = '<strong>Stack:</strong> ' + proj.stack;

      var links = el('div', 'proj-links');
      proj.links.forEach(function(lnk) {
        var a = el('a');
        a.href = lnk.href; a.target = '_blank'; a.textContent = lnk.label;
        links.appendChild(a);
      });

      append(block,
        hdr,
        el('div', 'block-sub', proj.subtitle),
        el('p',   null,        proj.description),
        stack,
        proj.links.length ? links : null
      );
      frag.appendChild(block);
    });
    return frag;
  }

  /* ── TOOLBAR ── */
  function buildToolbar() {
    var toolbar = el('div', 'toolbar');
    var btn = el('button', 'btn-pdf', 'Download PDF');
    btn.onclick = function(){ window.print(); };
    toolbar.appendChild(btn);
    return toolbar;
  }

  /* ── ASSEMBLE ── */
  var root = document.getElementById('resume-root');
  append(root,
    buildHeader(),
    el('hr'),
    buildToolbar(),
    heading('Professional Summary'), buildSummary(),
    heading('Work Experience'),      buildExperience(),
    heading('Skills'),               buildSkills(),
    heading('Education'),            buildEducation(),
    heading('Projects'),             buildProjects()
  );

  /* Set page title from name */
  document.title = RESUME.name + ' - Resume';

})();
</script>
</body>
</html>
